version: "2"

run:
  timeout: 5m

linters:
  default: all
  disable:
    # Impractical linters for this codebase
    - intrange           # Requires Go 1.22+ features, want to support older versions
    - testpackage        # Tests in same package is acceptable for testing internal behavior
    - exhaustruct        # Not practical to initialize all fields, especially for external types
    - varnamelen         # Short variable names in loops/functions are idiomatic Go
    - nonamedreturns     # Named returns are useful for documentation
    - gochecknoglobals   # Package-level variables are necessary for patterns, configs
    - gochecknoinits     # Init functions are necessary for registration patterns
    - ireturn            # Returning interfaces is sometimes appropriate
    - godox              # TODO/FIXME comments are useful during development
    - funlen             # Function length can be overly restrictive
    - gocognit           # Cognitive complexity can be overly restrictive
    - cyclop             # Cyclomatic complexity can be overly restrictive
    - maintidx           # Maintainability index can be overly restrictive
    - nestif             # Nesting is sometimes clearer than extraction
    - lll                # Line length varies in this codebase
    - wsl                # Whitespace linting is too opinionated
    - wsl_v5             # Whitespace linting is too opinionated (v5)
    - dupl               # Some duplication is acceptable in similar patterns
    - nlreturn           # Blank lines before returns is too opinionated
    - tagliatelle        # Struct tag formats don't need to be enforced
    - depguard           # Import restrictions not needed for this project
    - paralleltest       # Not all tests need to be parallel
    - godot              # Period at end of comments is too opinionated
    - thelper            # Helper function detection can be overly restrictive
    - gocyclo            # Cyclomatic complexity already covered by cyclop (disabled)
    - mnd                # Magic number detection is too strict for test values and date/time constants
    - testifylint        # Test-specific linting can be overly restrictive
    - forcetypeassert    # Type assertions in parsing code are validated by regex patterns
    - exhaustive         # Exhaustive switch checks are too strict
    - unparam            # Unused parameter detection can be too aggressive
    - nilnil             # Returning nil,nil is sometimes appropriate
    - gosmopolitan       # Time.Local usage is intentional
    - predeclared        # Shadowing predeclared identifiers is sometimes clearer
    - err113             # Dynamic errors are appropriate for detailed validation messages
    - goconst            # Repeated strings in tests don't always need to be constants
    - noinlineerr        # Inline error handling is idiomatic Go
    - unconvert          # Unnecessary conversions are harmless and sometimes aid clarity

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    govet:
      enable-all: true
      disable:
        - fieldalignment  # Disable field alignment checks as they're too pedantic and can hurt readability
        - shadow          # Variable shadowing is acceptable in many cases

    goconst:
      min-len: 3
      min-occurrences: 3

    gocritic:
      disabled-checks:
        - ifElseChain  # if-else is sometimes clearer than switch

    misspell:
      locale: US

    revive:
      rules:
        - name: exported
          arguments:
            - "checkPrivateReceivers"
            - "disableStutteringCheck"

  exclusions:
    rules:
      # Disable errcheck for test files
      - path: _test\.go
        linters:
          - errcheck
      # Disable errcheck and forbidigo for example files
      # Examples are demonstrations and should be simple/readable
      - path: examples/
        linters:
          - errcheck
          - forbidigo
      # Allow type alias comment format in internal_helpers.go
      # Type aliases in grouped declarations don't need individual comments
      - path: internal_helpers\.go
        text: "comment on exported type.*should be of the form"
      # Allow deprecated API usage in test files that test internal/advanced APIs
      # These tests need to use deprecated types to test the internal implementation
      - path: _test\.go
        text: "SA1019"
      # Allow deprecated API usage in en/en.go which provides the public API
      # This file uses internal types to construct Chrono instances
      - path: en/en\.go
        text: "SA1019"
      # Allow deprecated API usage in internal/ packages
      # These are internal implementations that legitimately use deprecated public types
      - path: internal/
        text: "SA1019"

formatters:
  settings:
    gofmt:
      simplify: true

    gofumpt:
      extra-rules: true

issues:
  max-same-issues: 0
  max-issues-per-linter: 0
